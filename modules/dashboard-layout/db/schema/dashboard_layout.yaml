entity: dashboard_layout
table: dashboard_layout
version: 1
database: OPZHUB
expose_generic_api: false
columns:
  - name: id
    type: uuid
    primary_key: true
    nullable: false
    default: gen_random_uuid()
  - name: company_id
    type: uuid
    nullable: false
  - name: app_key
    type: text
    nullable: false
  - name: role_key
    type: text
    nullable: false
  - name: template_key
    type: text
    nullable: true
  - name: layout_data
    type: jsonb
    nullable: false
  - name: updated_by
    type: uuid
    nullable: false
  - name: updated_at
    type: timestamptz
    nullable: false
    default: now()
indexes:
  - name: idx_dashboard_layout_lookup
    columns: [company_id, app_key, role_key]
    unique: true
foreign_keys:
  - column: company_id
    references_table: company_information
    references_column: id
    on_delete: restrict
