# Platform/central administrator registry (OPZMAIN). These accounts have
# NO company_id and are never routed through DataRouter to a company
# database — they operate only against OPZMAIN, scoped to the
# company-setup module (create/manage companies and licenses).
#
# Login trigger (doc 35 §2): typing a BARE username (no "/" and no "@")
# on the normal login field resolves against this table instead of a
# company-scoped id_user lookup.
entity: platform_admin
table: platform_admin
version: 1
database: OPZMAIN
columns:
  - name: id
    type: uuid
    primary_key: true
    nullable: false
    default: gen_random_uuid()

  - name: username
    type: text
    nullable: false
    unique: true
    max_length: 64

  - name: display_name
    type: text
    nullable: false
    max_length: 200

  - name: password_hash
    type: text
    nullable: false
    max_length: 500

  - name: enabled
    type: boolean
    nullable: false
    default: 'true'

  - name: created_at
    type: timestamptz
    nullable: false
    default: now()

indexes:
  - name: idx_platform_admin_username
    columns: [username]
    unique: true

foreign_keys: []
