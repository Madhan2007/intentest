# User profile preferences (OPZUSER — per-company).
# One row per user. Upserted (not inserted + updated separately).
entity: user_settings
table: user_settings
version: 1
database: OPZUSER
columns:
  - name: user_id
    type: uuid
    primary_key: true
    nullable: false
    comment: >
      FK to id_user.id in the same OPZUSER database.
      One settings row per user; PK doubles as the unique constraint.
  - name: preferred_language
    type: text
    nullable: true
    max_length: 10
    comment: >
      ISO 639-1 language code (e.g. "en", "ta", "hi").
      Null means the application default or browser locale is used.
  - name: timezone
    type: text
    nullable: true
    max_length: 64
    comment: >
      IANA timezone name (e.g. "Asia/Kolkata", "UTC").
      Null means the application default timezone from platform.yaml applies.
  - name: theme
    type: text
    nullable: true
    max_length: 16
    comment: >
      UI theme preference. Allowed values: "lite" | "rich" | "system".
      Null falls back to the solution-level gui.mode setting.
  - name: email_notifications_enabled
    type: boolean
    nullable: false
    default: "true"
    comment: >
      Whether the user wants email notification alerts.
  - name: updated_at
    type: timestamptz
    nullable: false
    default: now()
    comment: >
      Last modification time. Set automatically on upsert.
indexes:
  - name: idx_user_settings_user_id
    columns: [user_id]
foreign_keys:
  - column: user_id
    references_table: id_user
    references_column: id
    on_delete: cascade
    enforce: postgres
