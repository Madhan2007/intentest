[project]
name = "opzhub-kernel"
version = "0.0.0-dev"
description = "ManageMyOpz Python kernel (FastAPI media/OCR/mail engine) — doc 05"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    "pydantic>=2.8",
]

[project.optional-dependencies]
# Lazily imported only when db.type=postgres / cache.type=valkey (doc 07 §8).
postgres = ["asyncpg>=0.29"]
valkey = ["redis>=5.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["opzhub_kernel*"]
