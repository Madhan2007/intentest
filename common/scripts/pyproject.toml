[project]
name = "opzhub-scripts"
version = "0.0.0-dev"
description = "ManageMyOpz CLI kernel (opzhubctl) — doc 06"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["opzhub_scripts*"]
