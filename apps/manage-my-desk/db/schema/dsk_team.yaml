# dsk_team — a support team/group (the reference app's TEAM_MASTER).
entity: dsk_team
table: dsk_team
version: 1
database: OPZDESK
columns:
  - name: id
    type: uuid
    primary_key: true
    nullable: false
    default: gen_random_uuid()
  - name: company_id
    type: uuid
    nullable: false
  - name: team_name
    type: text
    nullable: false
    max_length: 100
  - name: description
    type: text
    nullable: true
  - name: created_at
    type: timestamptz
    nullable: false
    default: now()
indexes:
  - name: idx_dsk_team_company_name
    columns: [company_id, team_name]
    unique: true
foreign_keys:
  - column: company_id
    references_table: company_information
    references_column: id
    on_delete: restrict
