# ppl_leave_policy — entitlement policy for a leave type. Kept
# deliberately simple (one parameterized table, not a versioned-policy
# engine) — same simplification rationale originally documented for this
# table when it was drafted under apps/manage-my-hr.
entity: ppl_leave_policy
table: ppl_leave_policy
version: 1
database: OPZPEOPLE
columns:
  - name: id
    type: uuid
    primary_key: true
    nullable: false
    default: gen_random_uuid()
  - name: company_id
    type: uuid
    nullable: false
  - name: leave_type_id
    type: uuid
    nullable: false
  - name: policy_name
    type: text
    nullable: false
    max_length: 200
  - name: annual_entitlement_days
    type: numeric
    nullable: false
  - name: carry_forward_max_days
    type: numeric
    nullable: false
    default: "0"
  - name: accrual_frequency
    type: text
    nullable: false
    max_length: 16
    default: "'ANNUAL'"
    comment: MONTHLY | ANNUAL | NONE.
  - name: is_active
    type: boolean
    nullable: false
    default: "true"
  - name: created_at
    type: timestamptz
    nullable: false
    default: now()
  - name: updated_at
    type: timestamptz
    nullable: false
    default: now()
indexes:
  - name: idx_ppl_leave_policy_company_active
    columns: [company_id, is_active]
  - name: idx_ppl_leave_policy_leave_type
    columns: [leave_type_id]
foreign_keys:
  - column: company_id
    references_table: company_information
    references_column: id
    on_delete: restrict
  - column: leave_type_id
    references_table: ppl_leave_type
    references_column: id
    on_delete: restrict
    enforce: postgres
