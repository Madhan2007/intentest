# fin_payout — funds settled from the payment gateway to the company's
# own bank account. Company-level, not customer-specific. Same
# "wired-but-fieldless in the reference" note as fin_payment_transaction.yaml.
entity: fin_payout
table: fin_payout
version: 1
database: OPZFINANCE
columns:
  - name: id
    type: uuid
    primary_key: true
    nullable: false
    default: gen_random_uuid()
  - name: company_id
    type: uuid
    nullable: false
  - name: amount
    type: numeric
    nullable: false
  - name: currency
    type: text
    nullable: false
    max_length: 3
  - name: status
    type: text
    nullable: false
    max_length: 16
    default: "'PENDING'"
    comment: PENDING | IN_TRANSIT | PAID | FAILED.
  - name: payout_method
    type: text
    nullable: true
    max_length: 32
    comment: e.g. BANK_TRANSFER, CHECK.
  - name: gateway_reference
    type: text
    nullable: true
  - name: initiated_at
    type: timestamptz
    nullable: false
    default: now()
  - name: arrived_at
    type: timestamptz
    nullable: true
indexes:
  - name: idx_fin_payout_company_status
    columns: [company_id, status]
foreign_keys:
  - column: company_id
    references_table: company_information
    references_column: id
    on_delete: restrict
