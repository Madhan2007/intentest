# fin_customer_contact — a named contact person at a billed customer
# (billing contact, primary contact, ...).
entity: fin_customer_contact
table: fin_customer_contact
version: 1
database: OPZFINANCE
columns:
  - name: id
    type: uuid
    primary_key: true
    nullable: false
    default: gen_random_uuid()
  - name: customer_id
    type: uuid
    nullable: false
  - name: first_name
    type: text
    nullable: false
    max_length: 100
  - name: last_name
    type: text
    nullable: true
    max_length: 100
  - name: email
    type: text
    nullable: true
    max_length: 200
  - name: phone
    type: text
    nullable: true
    max_length: 32
  - name: contact_tag
    type: text
    nullable: true
    max_length: 32
    comment: e.g. "billing", "primary", "technical".
  - name: receives_account_emails
    type: boolean
    nullable: false
    default: "false"
  - name: receives_billing_emails
    type: boolean
    nullable: false
    default: "false"
  - name: created_at
    type: timestamptz
    nullable: false
    default: now()
indexes:
  - name: idx_fin_customer_contact_customer
    columns: [customer_id]
foreign_keys:
  - column: customer_id
    references_table: fin_customer
    references_column: id
    on_delete: cascade
    enforce: postgres
