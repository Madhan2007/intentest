# fin_customer_custom_field — EAV value store for per-company custom
# fields on a customer. Definitions live in id_field_definition
# (form_id "manage-my-finance.customer.custom"), not duplicated here —
# same pattern as ppl_person_custom_field, dsk_ticket_custom_field,
# dat_business_custom_field.
entity: fin_customer_custom_field
table: fin_customer_custom_field
version: 1
database: OPZFINANCE
columns:
  - name: id
    type: uuid
    primary_key: true
    nullable: false
    default: gen_random_uuid()
  - name: customer_id
    type: uuid
    nullable: false
  - name: field_key
    type: text
    nullable: false
    max_length: 64
    comment: Matches id_field_definition.field_key for form_id "manage-my-finance.customer.custom".
  - name: field_value
    type: text
    nullable: true
  - name: field_group
    type: text
    nullable: true
    max_length: 64
  - name: display_order
    type: integer
    nullable: false
    default: "0"
  - name: created_at
    type: timestamptz
    nullable: false
    default: now()
  - name: updated_at
    type: timestamptz
    nullable: false
    default: now()
indexes:
  - name: idx_fin_customer_custom_field_customer_key
    columns: [customer_id, field_key]
    unique: true
foreign_keys:
  - column: customer_id
    references_table: fin_customer
    references_column: id
    on_delete: cascade
    enforce: postgres
