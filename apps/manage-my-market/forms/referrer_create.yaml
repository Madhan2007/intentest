form_key: referrer_create
app_key: manage-my-market
title: Register Referrer
target_entity: mkt_referrer
api_endpoint: /api/v1/opzhub/manage-my-market/referrers
method: POST
fields:
  - name: name
    type: text
    label: Full Name / Organization
    required: true
  - name: referrerType
    type: choice
    label: Partner Type
    required: true
    default: AFFILIATE
    options:
      - { value: AFFILIATE, label: Affiliate Marketer }
      - { value: CUSTOMER, label: Existing Customer }
      - { value: PARTNER, label: Channel Partner }
      - { value: EMPLOYEE, label: Employee Referral }
  - name: email
    type: email
    label: Contact Email
    required: false
  - name: phone
    type: text
    label: Contact Phone
    required: false
  - name: commissionRate
    type: number
    label: Commission Rate (%)
    required: false
    default: 10.0
