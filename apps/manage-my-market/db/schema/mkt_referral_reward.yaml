# mkt_referral_reward — a payout owed or paid to a referrer for a
# converted referral lead.
entity: mkt_referral_reward
table: mkt_referral_reward
version: 1
database: OPZMARKET
columns:
  - name: id
    type: uuid
    primary_key: true
    nullable: false
    default: gen_random_uuid()
  - name: referrer_id
    type: uuid
    nullable: false
  - name: lead_id
    type: uuid
    nullable: true
  - name: amount
    type: decimal
    nullable: false
  - name: status
    type: text
    nullable: false
    max_length: 16
    default: "'PENDING'"
    comment: PENDING | APPROVED | PAID | REJECTED.
  - name: payout_details
    type: text
    nullable: true
  - name: created_at
    type: timestamptz
    nullable: false
    default: now()
  - name: updated_at
    type: timestamptz
    nullable: false
    default: now()
indexes:
  - name: idx_mkt_referral_reward_referrer_status
    columns: [referrer_id, status]
foreign_keys:
  - column: referrer_id
    references_table: mkt_referrer
    references_column: id
    on_delete: cascade
    enforce: postgres
  - column: lead_id
    references_table: mkt_lead
    references_column: id
    on_delete: restrict
    enforce: postgres
