# dat_business_workflow_log — append-only stage-transition audit trail for
# a business record. author_user_id is a cross-database logical reference
# to id_user.id; author_name is kept as a fallback for system-generated
# entries (the reference app logs an author_name of "System" for the
# automatic entry created on record creation).
entity: dat_business_workflow_log
table: dat_business_workflow_log
version: 1
database: OPZDATA
columns:
  - name: id
    type: uuid
    primary_key: true
    nullable: false
    default: gen_random_uuid()
  - name: business_id
    type: uuid
    nullable: false
  - name: from_stage
    type: text
    nullable: true
    max_length: 32
  - name: to_stage
    type: text
    nullable: false
    max_length: 32
  - name: author_user_id
    type: uuid
    nullable: true
    comment: Cross-database logical FK to id_user.id (OPZUSER). Null for system-generated entries.
  - name: author_name
    type: text
    nullable: true
    max_length: 100
    comment: Fallback label when author_user_id is not set, e.g. "System".
  - name: comment
    type: text
    nullable: true
  - name: created_at
    type: timestamptz
    nullable: false
    default: now()
indexes:
  - name: idx_dat_business_workflow_log_business_created
    columns: [business_id, created_at]
foreign_keys:
  - column: business_id
    references_table: dat_business
    references_column: id
    on_delete: cascade
    enforce: postgres
  - column: author_user_id
    references_table: id_user
    references_column: id
    on_delete: restrict
